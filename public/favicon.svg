<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Layer 1 (Back plate) -->
  <path d="M16 26 L32 18 L48 26 L32 34 Z" fill="#ffffff" fill-opacity="0.35"/>
  <!-- Layer 2 (Middle plate) -->
  <path d="M16 33 L32 25 L48 33 L32 41 Z" fill="#ffffff" fill-opacity="0.6"/>
  <!-- Layer 3 (Top main plate) -->
  <path d="M16 40 L32 32 L48 40 L32 48 Z" fill="url(#layerGrad)" filter="url(#shadow)"/>

  <!-- Central Meta Jewel / Sparkle -->
  <path d="M46 12 Q46 19 53 19 Q46 19 46 26 Q46 19 39 19 Q46 19 46 12 Z" fill="url(#sparkleGrad)"/>
</svg>
